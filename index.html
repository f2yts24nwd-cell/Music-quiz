<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Quiz</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music Quiz">
<meta name="theme-color" content="#110a24">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache">
<script>window.APP_V="2026.11.17-3";</script>
<link rel="stylesheet" href="style.css?v=2026.11.17-3">
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">

<!-- ================= HOME ================= -->
<section id="home" class="screen">
  <header class="home-head">
    <h1 class="logo"><span>Music</span><span>Quiz</span></h1>
    <div class="head-btns">
      <button class="iconbtn" data-sheet="board" aria-label="Bestenliste"><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0V4zM7 6H4v1a4 4 0 0 0 4 4M17 6h3v1a4 4 0 0 1-4 4M12 13v3M8 21h8M9.5 16h5l.5 5h-6z"/></svg></button>
      <button class="iconbtn" data-sheet="settings" aria-label="Einstellungen"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <button class="daily" id="daily">
    <div class="disc mini"></div>
    <div class="daily-txt">
      <b>Tages-Challenge</b>
      <span id="dailySub">5 Songs aus allen Genres. Nur der erste Versuch zählt.</span>
    </div>
    <div class="daily-go" id="dailyGo">Los</div>
  </button>

  <h2 class="sec">Spielmodus</h2>
  <div class="modes" id="modes"></div>
  <p class="mode-desc" id="modeDesc"></p>

  <h2 class="sec">Genre</h2>
  <div class="genres" id="genreList"></div>
</section>

<!-- ================= GAME ================= -->
<section id="game" class="screen hide">
  <div class="topbar">
    <button class="iconbtn sm" id="quit" aria-label="Runde beenden"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="dots" id="dots"></div>
    <div class="score" id="score">0</div>
  </div>
  <div class="subbar">
    <span class="pill hide" id="playerChip"></span>
    <span class="pill hide" id="lives"></span>
    <span class="streak" id="streak"></span>
  </div>
  <div class="blitz hide" id="blitzBar"><div id="blitzFill"></div></div>

  <div class="game-grid">
    <div class="stage-col">
      <div class="stage" id="stage">
        <svg class="ring" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="48"/><circle class="lim" id="ringLim" cx="50" cy="50" r="48"/><circle class="fg" id="ring" cx="50" cy="50" r="48"/></svg>
        <div class="disc big" id="disc"><div class="cover" id="coverWrap"><i id="cover"></i></div><div class="shine"></div></div>
        <button class="playbtn" id="play" aria-label="Abspielen"><svg viewBox="0 0 24 24" id="ico"><path d="M8 5v14l11-7z"/></svg></button>
      </div>
      <div class="time"><span id="tNow">0:00</span> / <span id="tMax">0:30</span></div>
      <div class="status" id="status"></div>
      <button class="more hide" id="more">Länger hören <em>−1</em></button>
      <div class="mixer" id="mixer">
        <div class="mx-row"><button class="mx-l" data-reset="vol">Volume</button><input type="range" id="mxVol" min="0" max="100" aria-label="Lautstärke"><span class="mx-v" id="mxVolV"></span></div>
        <div class="mx-row"><button class="mx-l" data-reset="tempo">Tempo</button><input type="range" id="mxTempo" min="-20" max="20" aria-label="Tempo"><span class="mx-v" id="mxTempoV"></span></div>
        <div class="mx-row" id="mxFilterRow"><button class="mx-l" data-reset="filter">Filter</button><input type="range" id="mxFilter" min="-100" max="100" aria-label="Filter"><span class="mx-v" id="mxFilterV"></span></div>
        <div class="pads">
          <button class="pad p1" data-pad="rewind"><svg viewBox="0 0 24 24"><path d="M11 6L4 12l7 6zM20 6l-7 6 7 6z"/></svg>Rewind</button>
          <button class="pad p2" data-pad="brake"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4"/></svg>Bremse</button>
          <button class="pad p3" data-pad="horn"><svg viewBox="0 0 24 24"><path d="M3 10v4h3l7 5V5L6 10zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Horn</button>
        </div>
      </div>
    </div>

    <div class="form-col">
      <form id="guess" autocomplete="off">
        <label class="fld"><span>Titel</span><input id="gTitle" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"></label>
        <label class="fld"><span>Interpret</span><input id="gArtist" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></label>
        <div class="yearlbl">Erscheinungsjahr</div>
        <div class="years" id="years"></div>
        <div class="usedhints" id="usedHints"></div>
        <div class="actions">
          <button type="button" class="hintbtn" id="hintBtn"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Tipp</span></button>
          <button type="submit" class="cta">Auflösen</button>
        </div>
      </form>

      <div id="reveal" class="hide">
        <div class="answer"><div class="a-t" id="aT"></div><div class="a-a" id="aA"></div><div class="a-y" id="aY"></div></div>
        <div class="res" id="rows"></div>
        <a class="deezer hide" id="dz" target="_blank" rel="noopener">Ganzen Song auf Deezer hören</a>
        <button class="cta" id="next">Nächster Song</button>
      </div>
    </div>
  </div>
</section>

<!-- ================= END ================= -->
<section id="end" class="screen hide">
  <div class="final">
    <div class="f-n" id="fN">0</div>
    <div class="f-v" id="fV"></div>
    <div class="f-h" id="fH"></div>
  </div>
  <div class="podium hide" id="podium"></div>
  <div class="summary" id="summary"></div>
  <div class="end-actions">
    <button class="cta" id="again">Noch eine Runde</button>
    <button class="ghost" id="share">Ergebnis teilen</button>
    <button class="ghost" id="toHome">Zur Startseite</button>
  </div>
</section>
</div>

<!-- ================= SHEETS ================= -->
<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet-setup" role="dialog" aria-modal="true" aria-labelledby="setupName">
  <div class="grab"></div>
  <div class="sheet-head"><div class="disc mini" id="setupDisc"></div><div><h3 id="setupName"></h3><p id="setupTag"></p></div></div>
  <div id="setupFilterWrap"><h4 id="setupFilterLbl">Jahrzehnte</h4><div class="chips" id="setupFilter"></div></div>
  <div id="partyWrap" class="hide">
    <h4>Spieler</h4>
    <div id="players"></div>
    <button class="ghost sm" id="addPlayer">Spieler hinzufügen</button>
  </div>
  <button class="setup-summary" id="setupSummary" data-sheet="settings"></button>
  <button class="cta" id="start">Runde starten</button>
</div>

<div class="sheet" id="sheet-hints" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3>Tipp nehmen</h3>
  <p class="sheet-sub">Jeder Tipp kostet bei diesem Song einen Punkt.</p>
  <div class="hintgrid" id="hintGrid"></div>
</div>

<div class="sheet" id="sheet-settings" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3>Einstellungen</h3>
  <div class="setlist" id="setList"></div>
  <button class="ghost danger" id="resetBoard">Bestenliste löschen</button>
  <p class="ver">Version <span id="ver"></span></p>
</div>

<div class="sheet" id="sheet-board" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3>Bestenliste</h3>
  <p class="sheet-sub">Gespeichert auf diesem Gerät.</p>
  <div class="chips scroll" id="boardFilter"></div>
  <ol class="board" id="board"></ol>
</div>

<div class="sheet" id="sheet-confirm" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="confirmTitle"></h3>
  <p class="sheet-sub" id="confirmText"></p>
  <div class="confirm-row"><button class="ghost" id="confirmNo">Abbrechen</button><button class="cta" id="confirmYes"></button></div>
</div>

<div class="handoff hide" id="handoff">
  <div class="disc big spin-slow"></div>
  <p>Gib das Gerät an</p>
  <h2 id="handName"></h2>
  <button class="cta" id="handGo">Bin bereit</button>
</div>

<div class="toast" id="toast"></div>

<!-- Genres: neue Datei in genres/ anlegen und hier einbinden -->
<script src="genres/trance.js?v=2026.11.17-3"></script>
<script src="genres/charts.js?v=2026.11.17-3"></script>
<script src="genres/achtziger.js?v=2026.11.17-3"></script>
<script src="genres/eurodance.js?v=2026.11.17-3"></script>
<script src="genres/nullerjahre.js?v=2026.11.17-3"></script>
<script src="genres/deutschrap.js?v=2026.11.17-3"></script>
<script src="genres/rock.js?v=2026.11.17-3"></script>
<script src="genres/schlager.js?v=2026.11.17-3"></script>
<script src="genres/kids.js?v=2026.11.17-3"></script>
<script src="app.js?v=2026.11.17-3"></script>
</body>
</html>
